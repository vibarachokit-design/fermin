<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E4C6E">
<title>El Vuelo del Gaviotín</title>
<meta name="description" content="Juego educativo sobre la conservación del Gaviotín Chico en Mejillones.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b2233; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none;
           -webkit-tap-highlight-color: transparent; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  #rotate { display: none; position: fixed; inset: auto 16px 24px 16px; padding: 14px 18px; border-radius: 18px;
            background: #F28C6B; color: #fff; font: 700 18px "Baloo 2", "Trebuchet MS", sans-serif; text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Juego El Vuelo del Gaviotín"></canvas>
<div id="rotate">📱↻ Gira tu celular para jugar en pantalla completa</div>
<noscript>Este juego necesita JavaScript activado.</noscript>
<script src="game.js"></script>
</body>
</html>
